AWSTemplateFormatVersion: 2010-09-09
Description: Launch an EC2 instance for nacl testing with IAM role for Session Manager access
Parameters:
  InstanceType:
    Type: String
    Default: "t2.micro"
    Description: The EC2 instance type
  ImageID:
    Type: String
    Default: "ami-0f918f7e67a3323f0"
  SubnetID:
    Type: String
    Default: "subnet-037040540aa04ad6c"
    Description: The ID of the subnet where the EC2 instance will be launched
  VPCID:
    Type: String
    Default: "vpc-098967a9d967af028"
    Description: The ID of the VPC where the EC2 instance will be launched
  SG:
    Type: String
    Default: "sg-0a825e2ea2e2d713f"
    Description: The ID of the security group to associate with the EC2 instance
Resources:
  EC2SSMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2SSMRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  EC2SSMInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2SSMRole
  MyEC2Instance: 
    Type: AWS::EC2::Instance
    Properties: 
      ImageId: !Ref ImageID
      InstanceType: !Ref InstanceType
      # The following lines are commented due to redundant usage in the NetworkInterfaces section
      # SubnetId: !Ref SubnetID
      # SecurityGroupIds: 
      #   - !Ref MySecurityGroup
      IamInstanceProfile: !Ref EC2SSMInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: 0
          SubnetId: !Ref SubnetID 
          GroupSet:
            - !Ref SG
      UserData:
        Fn::Base64: |
          #!/bin/bash
          sudo apt-get install lsb-release curl gpg -y
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          sudo chmod 644 /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update -y 
          sudo apt-get install redis -y
          sudo systemctl enable redis-server
          sudo systemctl start redis-server